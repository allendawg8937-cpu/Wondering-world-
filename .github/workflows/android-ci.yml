name: Build & Publish Downloadable Android APK & SDK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    name: Test, Lint & Build Downloadable APK & SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare CI Debug Keystore & Config
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f app/google-services.json ] && [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
          fi

      - name: Run Unit Tests & Compose UI Tests
        run: >
          gradle :app:testDebugUnitTest
          --tests "com.example.ExampleUnitTest"
          --tests "com.example.ExampleRobolectricTest"
          --tests "com.example.ui.components.PersonaAndUnifiedHeaderTest"
          --tests "com.example.ui.screens.LifeStage3DAvatarPreviewScreenTest"
          --tests "com.example.data.export.UserDataExportBuilderTest"

      - name: Run Android Lint
        continue-on-error: true
        run: gradle :app:lintDebug

      - name: Build Downloadable Debug APK
        run: gradle :app:assembleDebug

      - name: Package Downloadable APK & 3D Avatar SDK Bundle
        run: |
          mkdir -p dist-release/sdk/angular dist-release/sdk/android dist-release/sdk/database
          cp app/build/outputs/apk/debug/app-debug.apk dist-release/stages-of-life-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist-release/stages-of-life-v8.0-debug.apk
          (cd dist-release && sha256sum stages-of-life-debug.apk stages-of-life-v8.0-debug.apk > stages-of-life-debug.apk.sha256)
          cp angular-web/src/app/data-access/models/avatar-3d.model.ts dist-release/sdk/angular/
          cp angular-web/src/app/features/profile/avatar-3d-customizer/avatar-theme-selector.component.ts dist-release/sdk/angular/
          cp angular-web/src/app/features/profile/avatar-3d-customizer/avatar-3d-customizer.component.ts dist-release/sdk/angular/
          cp app/src/main/java/com/example/ui/components/ThreeDAvatarCatalog.kt dist-release/sdk/android/
          cp app/src/main/java/com/example/ui/screens/LifeStage3DAvatarPreviewScreen.kt dist-release/sdk/android/
          cp database/schema.sql dist-release/sdk/database/
          cp database/sqlite_schema.sql dist-release/sdk/database/
          cp .env.example dist-release/sdk/.env.example
          cat << 'EOF' > dist-release/sdk/README.md
          # Wondering World / Stages Of Life — 3D Avatar, SQL & Persona SDK (v8.0)
          Included files:
          - `angular/` — Angular 22 + Three.js 3D avatar customizer (`idle`, `wave`, `dance`, `levitate`, `victory`), theme selector, and typed models.
          - `android/` — Jetpack Compose `ThreeDAvatarCatalog.kt` presets (`kid`, `teen`, `student`, `adult`, `business`, `veteran`).
          - `database/` — PostgreSQL (`schema.sql`) and SQLite/Room (`sqlite_schema.sql`) platform schemas.
          - Android target config: `compileSdk 36`, `minSdk 24`, `targetSdk 36`, `versionCode 8`, `versionName "8.0"`.
          EOF
          (cd dist-release && zip -r wondering-world-avatar-3d-sdk.zip sdk)
          (cd dist-release && sha256sum wondering-world-avatar-3d-sdk.zip > wondering-world-avatar-3d-sdk.zip.sha256)

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stages-of-life-debug-apk
          path: |
            dist-release/stages-of-life-debug.apk
            dist-release/stages-of-life-v8.0-debug.apk
            dist-release/stages-of-life-debug.apk.sha256
          retention-days: 90

      - name: Upload Downloadable 3D Avatar SDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wondering-world-avatar-3d-sdk
          path: |
            dist-release/wondering-world-avatar-3d-sdk.zip
            dist-release/wondering-world-avatar-3d-sdk.zip.sha256
          retention-days: 90

      - name: Build Release App Bundle (AAB)
        if: ${{ secrets.KEYSTORE_PATH != '' || env.KEYSTORE_PATH != '' }}
        run: gradle :app:bundleRelease || gradle :app:assembleRelease
        continue-on-error: true

      - name: Publish Latest APK & SDK GitHub Release
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Stages Of Life — Latest Downloadable APK & SDK
          prerelease: true
          make_latest: false
          files: |
            dist-release/stages-of-life-debug.apk
            dist-release/stages-of-life-v8.0-debug.apk
            dist-release/stages-of-life-debug.apk.sha256
            dist-release/wondering-world-avatar-3d-sdk.zip
            dist-release/wondering-world-avatar-3d-sdk.zip.sha256
          body: |
            Automated build from `${{ github.sha }}`.
            - **Android APK**: `stages-of-life-debug.apk` / `stages-of-life-v8.0-debug.apk` (Android 7.0+ / API 24–36)
            - **3D Avatar SDK Bundle**: `wondering-world-avatar-3d-sdk.zip`

      - name: Publish Versioned GitHub Release APK & SDK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/stages-of-life-debug.apk
            dist-release/stages-of-life-v8.0-debug.apk
            dist-release/stages-of-life-debug.apk.sha256
            dist-release/wondering-world-avatar-3d-sdk.zip
            dist-release/wondering-world-avatar-3d-sdk.zip.sha256
          generate_release_notes: true
