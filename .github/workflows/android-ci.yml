name: Build & Publish Downloadable Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Test, Lint & Build Downloadable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Prepare CI Debug Keystore & Config
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f app/google-services.json ] && [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
          fi

      - name: Run Unit Tests & Compose UI Tests
        run: gradle :app:testDebugUnitTest --tests "*Example*" --tests "*PersonaAndUnifiedHeaderTest*" --tests "*UserDataExport*"

      - name: Run Android Lint
        run: gradle :app:lintDebug

      - name: Build Downloadable Debug APK
        run: gradle :app:assembleDebug

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stages-of-life-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Build Release App Bundle (AAB)
        if: ${{ secrets.KEYSTORE_PATH != '' || env.KEYSTORE_PATH != '' }}
        run: gradle :app:bundleRelease || gradle :app:assembleRelease
        continue-on-error: true

      - name: Publish GitHub Release APK on Version Tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
